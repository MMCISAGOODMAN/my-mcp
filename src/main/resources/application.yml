server:
  port: 8091

spring:
  application:
    name: my-mcp
  ai:
    mcp:
      server:
        enabled: true
        name: my-mcp
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        annotation-scanner:
          enabled: true

mcp:
  plus:
    enabled: true
    base-packages:
      - com.example.mymcp
    bean-types: ALL
    tool-name-strategy: CLASS_METHOD
    description-sources:
      - MCP_EXPOSE
      - SWAGGER
    exclude-deprecated: true

management:
  endpoints:
    web:
      exposure:
        include: health,mcpplus

logging:
  level:
    io.mcpplus: INFO
    org.springframework.ai: INFO
